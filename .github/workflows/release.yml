name: Release

# Produces a signed+notarized macOS build (arm64) 
# and unsigned Windows/Linux builds, attached to a draft GitHub Release.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            make: make:darwin
          - os: windows-latest
            make: make:win32
          - os: ubuntu-latest
            make: make:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install
        working-directory: GUI/app

      - name: Install code signing certificate
        if: matrix.os == 'macos-latest'
        uses: q42/actions/install-certificate@v1
        with:
          build-certificate-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          certificate-password: ${{ secrets.BUILD_CERTIFICATE_PASSWORD }}

      - name: Install App Store Connect API key
        if: matrix.os == 'macos-latest'
        run: |
          APP_STORE_CONNECT_API_KEY_PATH="${{ runner.temp }}/AuthKey.p8"
          echo "APP_STORE_CONNECT_API_KEY_PATH=$APP_STORE_CONNECT_API_KEY_PATH" >> $GITHUB_ENV
          echo -n "${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}" | base64 --decode -o "$APP_STORE_CONNECT_API_KEY_PATH"

      - name: Build
        run: pnpm ${{ matrix.make }}
        env:
          APPLE_API_KEY: ${{ env.APP_STORE_CONNECT_API_KEY_PATH }}
          APPLE_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}

      - uses: actions/upload-artifact@v7
        with:
          name: micrio-${{ matrix.os }}
          path: |
            GUI/app/out/make/**/*.dmg
            GUI/app/out/make/**/*.zip

      - name: Attach to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: |
            GUI/app/out/make/**/*.dmg
            GUI/app/out/make/**/*.zip
